name: Deploy to Rosti

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    concurrency: deploy-rosti
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # No bundler and no dependencies — "build" just assembles dist/ from the
      # static files. The résumé PDF is generated locally with `npm run pdf`
      # and committed, so CI needs no browser.
      - name: Build 🔧
        run: npm run build

      # nginx on the Rosti app serves /srv/app/public directly (see README).
      - name: Set up SSH 🔑
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ROSTI_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.ROSTI_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy 🚀
        run: |
          rsync -az --delete -e "ssh -p 13452" dist/ app@ssh.rosti.cz:/srv/app/public/
          ssh -p 13452 app@ssh.rosti.cz 'supervisorctl signal HUP nginx'
