name: Deploy to Rosti

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    concurrency: deploy-rosti
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # Node 24 runs src/build.ts directly (native type stripping). TypeScript
      # itself is only needed for the typecheck.
      - name: Set up Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install 📦
        run: npm ci

      - name: Typecheck 🔍
        run: npm run typecheck

      - name: Build 🔧
        run: npm run build

      # nginx on the Rosti app serves /srv/app/public directly (see README).
      - name: Set up SSH 🔑
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ROSTI_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.ROSTI_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy 🚀
        run: |
          rsync -az --delete -e "ssh -p 13452" dist/ app@ssh.rosti.cz:/srv/app/public/
          ssh -p 13452 app@ssh.rosti.cz 'supervisorctl signal HUP nginx'
